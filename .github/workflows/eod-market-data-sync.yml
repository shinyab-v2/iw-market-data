name: EOD Market Data Sync

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'schemas/**'
      - '.github/workflows/eod-market-data-sync.yml'
  schedule:
    # Run at 22:00 UTC Mon-Fri (07:00 KST Tue-Sat, after KR & US close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-fetch all prices'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('market-data-pr-{0}', github.event.pull_request.number) || 'eod-market-data-sync' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Market Data Regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test paired publishing, KRX EOD cutoff and financial data schemas
        run: |
          node scripts/build-market-data.test.mjs
          node scripts/krx-eod.test.mjs
          node scripts/financial-data.test.mjs

  sync-market-data:
    name: Sync EOD Prices and Indicators
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Market Data Builder
        run: node scripts/build-market-data.mjs

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- prices/ indicators/)" ]; then
            git add -- prices/ indicators/
            git commit -m "chore: auto-sync EOD market data ($(date -u +'%Y-%m-%d')) [skip ci]"
            git push
            echo "Published changed prices and indicators together."
          else
            echo "No market data diffs detected. Skipping commit."
          fi
